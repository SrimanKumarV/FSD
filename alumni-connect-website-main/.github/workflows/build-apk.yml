name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            mobile-wrapper/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build
        env:
          CI: false
          REACT_APP_API_URL: https://alumnex-backend-9y5t.onrender.com/api
          REACT_APP_BACKUP_API_URL: https://alumnex-backend-backup.onrender.com/api
          REACT_APP_GITHUB_CLIENT_ID: Ov23liziKGoBWdUOVmxJ

      - name: Install Mobile Wrapper Dependencies
        working-directory: ./mobile-wrapper
        run: npm ci

      - name: Sync Capacitor
        working-directory: ./mobile-wrapper
        run: |
          mkdir -p www
          cp -r ../frontend/build/* ./www/
          npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        working-directory: ./mobile-wrapper/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./mobile-wrapper/android
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: mobile-wrapper/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Generate Release Tag
        id: tag
        run: echo "tag=v1.0.0-build.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Alumnex Connect APK - Build #${{ github.run_number }}"
          body: |
            ## 📱 Alumnex Connect APK

            **Build:** #${{ github.run_number }}
            **Branch:** ${{ github.ref_name }}
            **Commit:** ${{ github.sha }}

            ### Download
            Download the APK below and install it on your Android device.

            > ⚠️ You may need to enable "Install from Unknown Sources" in your Android settings.
          files: mobile-wrapper/android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
