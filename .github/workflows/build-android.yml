name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Read App Version Information
        id: version
        run: |
          VERSION_NAME=$(node -p "require('./alumni-connect-website-main/mobile-wrapper/version.json').versionName || '1.0.2'")
          VERSION_CODE=$(node -p "require('./alumni-connect-website-main/mobile-wrapper/version.json').versionCode || 3")
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "Resolved version: v$VERSION_NAME (build: $VERSION_CODE)"

      - name: Install Frontend Dependencies
        working-directory: ./alumni-connect-website-main/frontend
        run: npm ci || npm install

      - name: Build Frontend
        working-directory: ./alumni-connect-website-main/frontend
        run: npm run build
        env:
          CI: "false"
          REACT_APP_API_URL: "https://alumnex-backend-backup.onrender.com/api"
          REACT_APP_BACKUP_API_URL: "https://alumnex-backend-backup.onrender.com/api"
          REACT_APP_GITHUB_CLIENT_ID: "Ov23liziKGoBWdUOVmxJ"

      - name: Install Mobile Dependencies
        working-directory: ./alumni-connect-website-main/mobile-wrapper
        run: npm install

      - name: Inject & Validate Firebase google-services.json
        run: |
          TARGET_FILE="alumni-connect-website-main/mobile-wrapper/android/app/google-services.json"

          if [ -n "${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > "$TARGET_FILE"
            echo "Decoded google-services.json from FIREBASE_GOOGLE_SERVICES_JSON_BASE64 secret."
          elif [ -n "${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}" > "$TARGET_FILE"
            echo "Wrote google-services.json from FIREBASE_GOOGLE_SERVICES_JSON secret."
          else
            echo "Secret not detected, injecting project-verified google-services.json fallback..."
            echo '' | base64 -d > "$TARGET_FILE"
          fi

          if [ ! -f "$TARGET_FILE" ] || [ ! -s "$TARGET_FILE" ]; then
            echo "::error::Firebase configuration could not be prepared."
            exit 1
          fi

          node -e '
            const fs = require("fs");
            const target = "alumni-connect-website-main/mobile-wrapper/android/app/google-services.json";
            let data;
            try {
              data = JSON.parse(fs.readFileSync(target, "utf8"));
            } catch (err) {
              console.error("::error::google-services.json is not valid JSON: " + err.message);
              process.exit(1);
            }
            const clients = data.client || [];
            const matched = clients.find(c => c.client_info?.android_client_info?.package_name === "com.alumnex.connect");
            if (!matched) {
              console.error("::error::PACKAGE MISMATCH! Package com.alumnex.connect not registered in google-services.json");
              process.exit(1);
            }
            console.log("Firebase google-services.json verified for com.alumnex.connect in project " + (data.project_info?.project_id || "unknown"));
          '

      - name: Sync Capacitor
        working-directory: ./alumni-connect-website-main/mobile-wrapper
        run: |
          rm -rf www
          mkdir -p www
          cp -R ../frontend/build/* www/
          npx cap sync android

      - name: Verify Push Notifications Native Plugin Linked
        run: |
          CAP_GRADLE="alumni-connect-website-main/mobile-wrapper/android/app/capacitor.build.gradle"
          if ! grep -q "capacitor-push-notifications" "$CAP_GRADLE"; then
            echo "::error::Push Notifications plugin (:capacitor-push-notifications) was not generated by Capacitor sync!"
            exit 1
          fi
          echo ":capacitor-push-notifications confirmed in capacitor.build.gradle"

      - name: Build Android APK
        working-directory: ./alumni-connect-website-main/mobile-wrapper/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Cleanup Temporary Firebase Configuration
        if: always()
        run: |
          rm -f alumni-connect-website-main/mobile-wrapper/android/app/google-services.json
          echo "Cleaned up temporary google-services.json"

      - name: Prepare Release APK with Version
        run: |
          APK_SRC="alumni-connect-website-main/mobile-wrapper/android/app/build/outputs/apk/debug/app-debug.apk"
          STANDARDIZED="AlumnexConnect-v${{ env.VERSION_NAME }}.apk"
          cp "$APK_SRC" "$STANDARDIZED"
          echo "STANDARDIZED_APK=$STANDARDIZED" >> $GITHUB_ENV
          echo "APK successfully prepared: $STANDARDIZED"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlumnexConnect-v${{ env.VERSION_NAME }}
          path: ${{ env.STANDARDIZED_APK }}

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.VERSION_NAME }}"
          name: "Alumnex Connect v${{ env.VERSION_NAME }} (Build #${{ github.run_number }})"
          make_latest: true
          body: |
            ## 📱 Alumnex Connect v${{ env.VERSION_NAME }}

            [versionCode: ${{ env.VERSION_CODE }}]
            **Version:** v${{ env.VERSION_NAME }} (Code: ${{ env.VERSION_CODE }})
            **Build:** #${{ github.run_number }}
            **Branch:** ${{ github.ref_name }}
            **Commit:** ${{ github.sha }}

            ### 🚀 What's New
            - Full production repair of Android FCM Push Notifications pipeline
            - Real Firebase Android SDK integration with `alumnex-connect-e4000`
            - Android 13+ runtime notification permissions and `alumnex_default` notification channel
            - Automatic in-app update installation

            ### 📥 Download & Install
            Download **`${{ env.STANDARDIZED_APK }}`** below and install it on your device.
          files: |
            ${{ env.STANDARDIZED_APK }}
            alumni-connect-website-main/mobile-wrapper/android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
