name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: |
            mobile-wrapper/package-lock.json

      - name: Read App Version Information
        id: version
        run: |
          VERSION_NAME=$(node -p "require('./mobile-wrapper/version.json').versionName")
          VERSION_CODE=$(node -p "require('./mobile-wrapper/version.json').versionCode")
          MIN_VERSION_CODE=$(node -p "require('./mobile-wrapper/version.json').minVersionCode || 1")
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "MIN_VERSION_CODE=$MIN_VERSION_CODE" >> $GITHUB_ENV
          echo "Resolved version: v$VERSION_NAME (code: $VERSION_CODE, minCode: $MIN_VERSION_CODE)"

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build
        env:
          CI: false
          REACT_APP_API_URL: https://alumnex-backend-backup.onrender.com/api
          REACT_APP_BACKUP_API_URL: https://alumnex-backend-9y5t.onrender.com/api
          REACT_APP_GITHUB_CLIENT_ID: Ov23liziKGoBWdUOVmxJ
          REACT_APP_GOOGLE_CLIENT_ID: 253683997850-ec2t9ae74tnrsadu6enid73lnpeoho7d.apps.googleusercontent.com

      - name: Install Mobile Wrapper Dependencies
        working-directory: ./mobile-wrapper
        run: npm ci || npm install

      - name: Inject & Validate Firebase google-services.json
        run: |
          TARGET_FILE="mobile-wrapper/android/app/google-services.json"

          # 1. Decode secret if provided as base64 or raw JSON
          if [ -n "${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > "$TARGET_FILE"
            echo "Decoded google-services.json from FIREBASE_GOOGLE_SERVICES_JSON_BASE64."
          elif [ -n "${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}" > "$TARGET_FILE"
            echo "Wrote google-services.json from FIREBASE_GOOGLE_SERVICES_JSON."
          fi

          # 2. Strict presence validation: Fail build if configuration missing
          if [ ! -f "$TARGET_FILE" ] || [ ! -s "$TARGET_FILE" ]; then
            echo "::error::FIREBASE CONFIGURATION MISSING! Neither FIREBASE_GOOGLE_SERVICES_JSON_BASE64 nor FIREBASE_GOOGLE_SERVICES_JSON secret is set in GitHub repository secrets."
            echo "::error::An Android APK built without google-services.json will fail native FCM registration on device."
            exit 1
          fi

          # 3. Deep validation: package name must be com.alumnex.connect and valid Firebase credentials
          node -e '
            const fs = require("fs");
            const target = "mobile-wrapper/android/app/google-services.json";
            let data;
            try {
              data = JSON.parse(fs.readFileSync(target, "utf8"));
            } catch (err) {
              console.error("::error::google-services.json is not valid JSON: " + err.message);
              process.exit(1);
            }

            const projectInfo = data.project_info || {};
            const projectId = projectInfo.project_id;
            const projectNumber = projectInfo.project_number;
            console.log("Validating Firebase project: " + projectId + " (number: " + projectNumber + ")");

            if (!projectId || !projectNumber) {
              console.error("::error::google-services.json missing project_info.project_id or project_number");
              process.exit(1);
            }

            const clients = data.client || [];
            if (!Array.isArray(clients) || clients.length === 0) {
              console.error("::error::google-services.json has no registered client applications");
              process.exit(1);
            }

            const matchedClient = clients.find(c =>
              c.client_info?.android_client_info?.package_name === "com.alumnex.connect"
            );

            if (!matchedClient) {
              const registeredPackages = clients.map(c => c.client_info?.android_client_info?.package_name).filter(Boolean);
              console.error("::error::PACKAGE MISMATCH! google-services.json does not contain package com.alumnex.connect. Found: " + registeredPackages.join(", "));
              console.error("::error::The Firebase Android application MUST be registered as com.alumnex.connect");
              process.exit(1);
            }

            const appId = matchedClient.client_info?.mobilesdk_app_id;
            const apiKeys = matchedClient.api_key || [];
            if (!appId || apiKeys.length === 0) {
              console.error("::error::google-services.json missing mobilesdk_app_id or api_key for com.alumnex.connect");
              process.exit(1);
            }

            console.log("✅ Firebase google-services.json validated successfully for com.alumnex.connect");
          '

      - name: Sync Capacitor
        working-directory: ./mobile-wrapper
        run: |
          mkdir -p www
          cp -r ../frontend/build/* ./www/
          npx cap sync android

      - name: Verify Push Notifications Native Plugin Linked
        run: |
          if ! grep -q "capacitor-push-notifications" mobile-wrapper/android/app/capacitor.build.gradle; then
            echo "::error::Native Push Notifications plugin (:capacitor-push-notifications) was not generated by Capacitor sync!"
            exit 1
          fi
          echo "✅ :capacitor-push-notifications confirmed in capacitor.build.gradle"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Keystore Signing (if secret provided)
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > mobile-wrapper/android/app/release.keystore
            echo "Release keystore configured from secret."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret provided; building with fallback signing config."
          fi

      - name: Make gradlew executable
        working-directory: ./mobile-wrapper/android
        run: chmod +x gradlew

      - name: Build Release APK
        working-directory: ./mobile-wrapper/android
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Cleanup Temporary Firebase Configuration
        if: always()
        run: |
          rm -f mobile-wrapper/android/app/google-services.json
          echo "Cleaned up temporary google-services.json"

      - name: Package Standardized APK and Calculate SHA-256
        run: |
          APK_FOUND=$(find mobile-wrapper/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_FOUND" ]; then
            echo "Error: No APK file generated!"
            exit 1
          fi

          STANDARDIZED_NAME="AlumnexConnect-v${{ env.VERSION_NAME }}.apk"
          cp "$APK_FOUND" "$STANDARDIZED_NAME"

          # Generate SHA-256 checksum file
          sha256sum "$STANDARDIZED_NAME" > "${STANDARDIZED_NAME}.sha256"
          RAW_HASH=$(cut -d ' ' -f 1 "${STANDARDIZED_NAME}.sha256")

          echo "SHA256_HASH=$RAW_HASH" >> $GITHUB_ENV
          echo "STANDARDIZED_APK=$STANDARDIZED_NAME" >> $GITHUB_ENV
          echo "STANDARDIZED_SHA=${STANDARDIZED_NAME}.sha256" >> $GITHUB_ENV
          echo "APK successfully prepared: $STANDARDIZED_NAME (SHA-256: $RAW_HASH)"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlumnexConnect-v${{ env.VERSION_NAME }}
          path: |
            ${{ env.STANDARDIZED_APK }}
            ${{ env.STANDARDIZED_SHA }}

      - name: Generate Automated Release Notes from Git History
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          echo "Previous release tag: $PREV_TAG"
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"* %s (%h)" "$PREV_TAG..HEAD")
          else
            COMMITS=$(git log -15 --pretty=format:"* %s (%h)")
          fi

          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "$COMMITS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create GitHub Release with APK & Checksum
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.VERSION_NAME }}"
          name: "Alumnex Connect v${{ env.VERSION_NAME }}"
          generate_release_notes: true
          body: |
            ## 📱 Alumnex Connect v${{ env.VERSION_NAME }} (Build ${{ env.VERSION_CODE }})

            ### 🚀 Download & Install
            Download **`AlumnexConnect-v${{ env.VERSION_NAME }}.apk`** below to install or update Alumnex Connect on your Android device.

            ### 🔒 Security Verification
            - **Application ID:** `com.alumnex.connect`
            - **Version Name:** `${{ env.VERSION_NAME }}`
            - **Version Code:** `${{ env.VERSION_CODE }}`
            - **Minimum Supported Version Code:** `${{ env.MIN_VERSION_CODE }}`
            - **SHA-256:** `${{ env.SHA256_HASH }}`

            ### 📋 What's New in this Release
            - In-app automatic update system with GitHub Releases integration
            - Real-time download progress bar and SHA-256 checksum verification
            - Native Android Package Installer handoff with FileProvider support
            - Settings page update status and manual check functionality
            - Performance optimizations and ecosystem stability improvements

            ### 📝 Recent Commits in this Build
            ${{ env.CHANGELOG }}

            <!-- [versionCode: ${{ env.VERSION_CODE }}] [minVersionCode: ${{ env.MIN_VERSION_CODE }}] -->
          files: |
            ${{ env.STANDARDIZED_APK }}
            ${{ env.STANDARDIZED_SHA }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
